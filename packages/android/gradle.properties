# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are overridden by the gradle.properties
# file when you resolve or assemble a gradle project.
# To disable the override, comment out the property key.

# Project properties
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m
org.gradle.parallel=true
org.gradle.daemon=true

# Android build properties
android.useAndroidX=true
android.enableJetifier=true
android.defaultConfig.targetSdk=35
android.compileSdkVersion=35

# BuildConfig properties (can be overridden via CLI with -P)
BACKEND_URL=http://localhost:3001
